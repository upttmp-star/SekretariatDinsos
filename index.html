<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sekre Dinsos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1020; --bg2:#121936; --card:rgba(255,255,255,.05); --card-b:rgba(255,255,255,.10);
  --text:#eef1fb; --muted:#9aa4c7; --gold:#d9b66b; --gold2:#f3dca1; --danger:#ff6b81; --ok:#4ade80;
  --radius:20px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Inter',system-ui,sans-serif;color:var(--text);min-height:100vh;
  background:
    radial-gradient(900px 500px at 12% -10%,rgba(217,182,107,.14),transparent 60%),
    radial-gradient(800px 500px at 100% 10%,rgba(99,102,241,.18),transparent 60%),
    linear-gradient(180deg,var(--bg),var(--bg2));
  background-attachment:fixed;
}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
header.top{display:flex;align-items:center;justify-content:space-between;padding:22px 0}
.brand{display:flex;align-items:center;gap:12px;font-family:'Playfair Display',serif;font-size:1.25rem;font-weight:700;letter-spacing:.3px}
.brand .dot{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1b1405;font-size:1.1rem}
.btn{border:1px solid var(--card-b);background:var(--card);color:var(--text);padding:10px 18px;border-radius:12px;
  font:inherit;font-weight:500;cursor:pointer;transition:.2s;backdrop-filter:blur(8px)}
.btn:hover{border-color:var(--gold);color:var(--gold2);transform:translateY(-1px)}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1b1405;border:none;font-weight:600}
.btn.gold:hover{color:#1b1405;filter:brightness(1.06)}
.btn.danger:hover{border-color:var(--danger);color:var(--danger)}
.btn.sm{padding:7px 12px;font-size:.85rem;border-radius:10px}
.btn:disabled{opacity:.5;cursor:wait;transform:none}

.hero{text-align:center;padding:42px 0 26px}
.hero h1{font-family:'Playfair Display',serif;font-size:clamp(2rem,5vw,3.4rem);line-height:1.1;margin-bottom:12px}
.hero h1 span{background:linear-gradient(135deg,var(--gold),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);max-width:560px;margin:0 auto 26px}
.search{position:relative;max-width:520px;margin:0 auto}
.search input{width:100%;padding:15px 20px 15px 48px;border-radius:16px;border:1px solid var(--card-b);
  background:var(--card);color:var(--text);font:inherit;outline:none;backdrop-filter:blur(8px);transition:.2s}
.search input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(217,182,107,.12)}
.search svg{position:absolute;left:17px;top:50%;transform:translateY(-50%);opacity:.6}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;padding:30px 0 70px}
.card{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:28px 20px 24px;
  border-radius:var(--radius);background:var(--card);border:1px solid var(--card-b);text-decoration:none;color:inherit;
  backdrop-filter:blur(10px);transition:.25s;position:relative;overflow:hidden;animation:rise .5s both}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(240px 140px at 50% 0%,rgba(217,182,107,.16),transparent 70%);opacity:0;transition:.3s}
.card:hover{transform:translateY(-6px);border-color:rgba(217,182,107,.55);box-shadow:0 18px 40px -16px rgba(0,0,0,.6)}
.card:hover::before{opacity:1}
.logo{width:84px;height:84px;border-radius:22px;background:#fff;display:grid;place-items:center;overflow:hidden;
  box-shadow:0 10px 24px -10px rgba(0,0,0,.6);position:relative;z-index:1}
.logo img{width:100%;height:100%;object-fit:contain;padding:10px}
.logo.fallback{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1b1405;font-family:'Playfair Display',serif;font-size:2rem;font-weight:700}
.card h3{font-size:1.05rem;font-weight:600;position:relative;z-index:1}
.card .host{font-size:.8rem;color:var(--muted);position:relative;z-index:1;word-break:break-all}
.card .go{font-size:.8rem;color:var(--gold);opacity:0;transform:translateY(4px);transition:.25s;position:relative;z-index:1}
.card:hover .go{opacity:1;transform:none}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 0}
footer{text-align:center;color:var(--muted);font-size:.82rem;padding:0 0 30px}

/* Admin */
.panel{display:grid;grid-template-columns:380px 1fr;gap:22px;padding:10px 0 70px}
@media(max-width:900px){.panel{grid-template-columns:1fr}}
.box{background:var(--card);border:1px solid var(--card-b);border-radius:var(--radius);padding:24px;backdrop-filter:blur(10px)}
.box h2{font-family:'Playfair Display',serif;font-size:1.3rem;margin-bottom:16px}
label{display:block;font-size:.82rem;color:var(--muted);margin:14px 0 6px}
input[type=text],input[type=url],input[type=password]{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--card-b);
  background:rgba(0,0,0,.25);color:var(--text);font:inherit;outline:none;transition:.2s}
input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(217,182,107,.12)}
.drop{display:flex;align-items:center;gap:14px;padding:12px;border:1.5px dashed var(--card-b);border-radius:14px;cursor:pointer;transition:.2s}
.drop:hover{border-color:var(--gold)}
.drop .logo{width:56px;height:56px;border-radius:14px;flex:none}
.drop small{color:var(--muted);display:block;font-size:.78rem;margin-top:2px}
.row-btns{display:flex;gap:10px;margin-top:20px}
.row-btns .btn{flex:1}
.list{display:flex;flex-direction:column;gap:10px;max-height:640px;overflow:auto;padding-right:4px}
.item{display:flex;align-items:center;gap:14px;padding:12px;border-radius:14px;border:1px solid var(--card-b);background:rgba(0,0,0,.18)}
.item .logo{width:48px;height:48px;border-radius:12px;flex:none;font-size:1.2rem}
.item .info{flex:1;min-width:0}
.item .info b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .info span{font-size:.8rem;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .acts{display:flex;gap:6px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 0 20px}
.bar h1{font-family:'Playfair Display',serif;font-size:1.7rem}

/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(5,8,20,.7);backdrop-filter:blur(6px);display:none;place-items:center;z-index:50;padding:20px}
.modal.show{display:grid}
.modal .box{width:100%;max-width:380px;background:#141b3a}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(30px);background:#1b2347;border:1px solid var(--card-b);
  padding:12px 20px;border-radius:12px;opacity:0;pointer-events:none;transition:.3s;z-index:60;font-size:.9rem}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.err{border-color:var(--danger)} .toast.ok{border-color:var(--ok)}
.hidden{display:none!important}
.skeleton{height:190px;border-radius:var(--radius);background:linear-gradient(90deg,var(--card),rgba(255,255,255,.09),var(--card));background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{to{background-position:-200% 0}}
</style>
</head>
<body>
<div class="wrap">

  <!-- ===== HALAMAN PUBLIK ===== -->
  <section id="viewPublic">
    <header class="top">
      <div class="brand"><div class="dot">✦</div>Portal Tautan</div>
      <button class="btn" id="btnAdmin">Admin</button>
    </header>

    <div class="hero">
      <h1>Semua <span>Tautan Penting</span><br>dalam Satu Tempat</h1>
      <p>Klik kartu untuk langsung menuju website yang Anda butuhkan.</p>
      <div class="search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="text" placeholder="Cari website…" autocomplete="off">
      </div>
    </div>

    <div class="grid" id="grid"></div>
    <footer>© <span id="yr"></span> Portal Tautan</footer>
  </section>

  <!-- ===== HALAMAN ADMIN ===== -->
  <section id="viewAdmin" class="hidden">
    <header class="top">
      <div class="brand"><div class="dot">✦</div>Admin Panel</div>
      <div style="display:flex;gap:8px">
        <button class="btn" id="btnBack">← Lihat Portal</button>
        <button class="btn danger" id="btnLogout">Keluar</button>
      </div>
    </header>

    <div class="panel">
      <div class="box">
        <h2 id="formTitle">Tambah Tautan</h2>
        <input type="hidden" id="fId">
        <label>Nama Judul</label>
        <input type="text" id="fJudul" placeholder="Contoh: Website Kota Cirebon">
        <label>Alamat Link</label>
        <input type="text" id="fLink" placeholder="https://contoh.go.id">
        <label>Logo</label>
        <div class="drop" id="drop">
          <div class="logo fallback" id="prev">+</div>
          <div><b style="font-weight:600">Pilih gambar logo</b><small>PNG / JPG / SVG · otomatis diperkecil</small></div>
        </div>
        <input type="file" id="fFile" accept="image/*" class="hidden">
        <label>atau tempel URL logo (opsional)</label>
        <input type="text" id="fLogoUrl" placeholder="https://…/logo.png">
        <div class="row-btns">
          <button class="btn gold" id="btnSave">Simpan</button>
          <button class="btn" id="btnReset">Batal</button>
        </div>
      </div>

      <div class="box">
        <h2>Daftar Tautan (<span id="cnt">0</span>)</h2>
        <div class="list" id="list"></div>
      </div>
    </div>
  </section>
</div>

<!-- Modal login -->
<div class="modal" id="mLogin">
  <div class="box">
    <h2>Login Admin</h2>
    <label>Password</label>
    <input type="password" id="pw" placeholder="Masukkan password">
    <div class="row-btns">
      <button class="btn gold" id="btnLogin">Masuk</button>
      <button class="btn" id="btnCancel">Batal</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let DATA = [], TOKEN = sessionStorageGet('tok'), logoData = null, keepLogo = false;

function sessionStorageGet(k){ try{return sessionStorage.getItem(k)}catch(e){return null} }
function sessionStorageSet(k,v){ try{ v==null?sessionStorage.removeItem(k):sessionStorage.setItem(k,v) }catch(e){} }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])) }
function host(u){ try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return u} }
function toast(msg,type){ const t=$('toast'); t.textContent=msg; t.className='toast show '+(type||''); clearTimeout(t._t); t._t=setTimeout(()=>t.className='toast',2800) }
// === ISI DENGAN URL WEB APP APPS SCRIPT ANDA (berakhiran /exec) ===
const API_URL = 'https://script.google.com/macros/s/AKfycbwbkdEBlnye4okuHXojQsWZYt2MY97RAaEvhfndGB_g5osssI2hD_mmr_Ijd2VEzLvt/exec';

function run(fn,...args){
  // Mode 1: dibuka langsung dari Apps Script
  if(window.google && google.script && google.script.run){
    return new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(new Error((e&&e.message||String(e)).replace(/^Error:\s*/,'')))) [fn](...args));
  }
  // Mode 2: di-hosting di domain sendiri -> panggil API Apps Script
  if(!API_URL || API_URL.indexOf('PASTE_')===0) return Promise.reject(new Error('API_URL belum diisi di Index.html'));
  const body = fn==='getLinks' ? {action:fn}
    : fn==='adminLogin' ? {action:fn,password:args[0]}
    : fn==='adminSave' ? {action:fn,token:args[0],data:args[1]}
    : {action:fn,token:args[0],id:args[1]};
  return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)})
    .then(r=>r.json())
    .then(r=>{
      if(fn==='adminLogin') return r;
      if(r.ok===false) throw new Error(r.message||'Terjadi kesalahan');
      return r.data;
    });
}
function logoHtml(d,cls){
  const src = d.logo || ('https://www.google.com/s2/favicons?sz=128&domain='+encodeURIComponent(host(d.link)));
  const ini = esc((d.judul||'?').trim().charAt(0).toUpperCase());
  return `<div class="logo ${cls||''}"><img src="${esc(src)}" alt="" loading="lazy"
    onerror="this.parentNode.classList.add('fallback');this.parentNode.textContent='${ini}'"></div>`;
}

/* ---------- Publik ---------- */
function renderGrid(){
  const q = $('q').value.trim().toLowerCase();
  const rows = DATA.filter(d => !q || (d.judul+' '+d.link).toLowerCase().includes(q));
  $('grid').innerHTML = rows.length ? rows.map((d,i)=>`
    <a class="card" href="${esc(d.link)}" target="_blank" rel="noopener noreferrer" style="animation-delay:${Math.min(i,12)*40}ms">
      ${logoHtml(d)}
      <h3>${esc(d.judul)}</h3>
      <div class="host">${esc(host(d.link))}</div>
      <div class="go">Buka website →</div>
    </a>`).join('') : `<div class="empty">${DATA.length?'Tidak ada hasil yang cocok.':'Belum ada tautan. Tambahkan lewat halaman Admin.'}</div>`;
}
function load(){
  $('grid').innerHTML = '<div class="skeleton"></div>'.repeat(4);
  run('getLinks').then(r=>{ DATA=r; renderGrid(); renderList(); })
    .catch(e=>{ $('grid').innerHTML='<div class="empty">Gagal memuat data: '+esc(e.message)+'</div>' });
}
$('q').addEventListener('input',renderGrid);
$('yr').textContent = new Date().getFullYear();

/* ---------- Navigasi ---------- */
function show(v){ $('viewPublic').classList.toggle('hidden',v!=='public'); $('viewAdmin').classList.toggle('hidden',v!=='admin'); window.scrollTo(0,0) }
$('btnAdmin').onclick = ()=>{ if(TOKEN){ show('admin') } else { $('mLogin').classList.add('show'); setTimeout(()=>$('pw').focus(),50) } };
$('btnBack').onclick = ()=>show('public');
$('btnCancel').onclick = ()=>$('mLogin').classList.remove('show');
$('btnLogout').onclick = ()=>{ TOKEN=null; sessionStorageSet('tok',null); show('public'); toast('Anda telah keluar') };
$('pw').addEventListener('keydown',e=>{ if(e.key==='Enter') $('btnLogin').click() });
$('btnLogin').onclick = async ()=>{
  const b=$('btnLogin'); b.disabled=true;
  try{
    const r = await run('adminLogin',$('pw').value);
    if(!r.ok){ toast(r.message,'err'); return }
    TOKEN=r.token; sessionStorageSet('tok',TOKEN); $('pw').value='';
    $('mLogin').classList.remove('show'); show('admin'); toast('Login berhasil','ok');
  }catch(e){ toast(e.message,'err') } finally{ b.disabled=false }
};

/* ---------- Admin: form ---------- */
function setPreview(src,ini){
  const p=$('prev');
  if(src){ p.className='logo'; p.innerHTML=`<img src="${esc(src)}" alt="">` }
  else { p.className='logo fallback'; p.textContent=ini||'+' }
}
function resetForm(){
  $('fId').value=''; $('fJudul').value=''; $('fLink').value=''; $('fLogoUrl').value=''; $('fFile').value='';
  logoData=null; keepLogo=false; $('formTitle').textContent='Tambah Tautan'; setPreview(null);
}
$('btnReset').onclick = resetForm;
$('drop').onclick = ()=>$('fFile').click();
$('fLogoUrl').addEventListener('input',e=>{ logoData=null; keepLogo=false; setPreview(e.target.value.trim()||null) });

// perkecil gambar agar ringan (maks 256px)
$('fFile').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  if(f.size>8*1024*1024){ toast('Ukuran gambar maksimal 8 MB','err'); return }
  const fr=new FileReader();
  fr.onload=()=>{
    if(f.type==='image/svg+xml'){
      logoData={base64:fr.result.split(',')[1],mime:f.type,name:f.name}; setPreview(fr.result); return;
    }
    const img=new Image();
    img.onload=()=>{
      const max=256, s=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      const url=c.toDataURL('image/png');
      logoData={base64:url.split(',')[1],mime:'image/png',name:(f.name.replace(/\.\w+$/,'')||'logo')+'.png'};
      $('fLogoUrl').value=''; keepLogo=false; setPreview(url);
    };
    img.src=fr.result;
  };
  fr.readAsDataURL(f);
});

$('btnSave').onclick = async ()=>{
  const judul=$('fJudul').value.trim(), link=$('fLink').value.trim();
  if(!judul||!link){ toast('Judul dan alamat link wajib diisi','err'); return }
  const b=$('btnSave'); b.disabled=true; b.textContent='Menyimpan…';
  try{
    DATA = await run('adminSave',TOKEN,{id:$('fId').value||null,judul,link,logoData,logoUrl:$('fLogoUrl').value.trim(),keepLogo});
    renderGrid(); renderList(); resetForm(); toast('Tautan tersimpan','ok');
  }catch(e){ toast(e.message,'err'); if(/Sesi/.test(e.message)){ TOKEN=null; sessionStorageSet('tok',null); show('public') } }
  finally{ b.disabled=false; b.textContent='Simpan' }
};

/* ---------- Admin: daftar ---------- */
function renderList(){
  $('cnt').textContent=DATA.length;
  $('list').innerHTML = DATA.length ? DATA.map(d=>`
    <div class="item">
      ${logoHtml(d)}
      <div class="info"><b>${esc(d.judul)}</b><span>${esc(d.link)}</span></div>
      <div class="acts">
        <button class="btn sm" data-edit="${esc(d.id)}">Edit</button>
        <button class="btn sm danger" data-del="${esc(d.id)}">Hapus</button>
      </div>
    </div>`).join('') : '<div class="empty" style="padding:30px 0">Belum ada data.</div>';
}
$('list').addEventListener('click',async e=>{
  const ed=e.target.closest('[data-edit]'), dl=e.target.closest('[data-del]');
  if(ed){
    const d=DATA.find(x=>x.id===ed.dataset.edit); if(!d) return;
    $('fId').value=d.id; $('fJudul').value=d.judul; $('fLink').value=d.link; $('fLogoUrl').value=''; $('fFile').value='';
    logoData=null; keepLogo=!!d.logo; $('formTitle').textContent='Edit Tautan';
    setPreview(d.logo||null,(d.judul||'?').charAt(0).toUpperCase()); window.scrollTo({top:0,behavior:'smooth'});
  }
  if(dl){
    const d=DATA.find(x=>x.id===dl.dataset.del);
    if(!d||!confirm('Hapus "'+d.judul+'"?')) return;
    try{ DATA=await run('adminDelete',TOKEN,d.id); renderGrid(); renderList(); toast('Tautan dihapus','ok') }
    catch(err){ toast(err.message,'err') }
  }
});

load();
</script>
</body>
</html>
